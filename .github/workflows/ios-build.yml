name: iOS Build & Test

on:
  push:
    branches: [main, 'claude/**']
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.claude/**'
      - 'Skills/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.claude/**'
      - 'Skills/**'

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    name: Xcode Build (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          # Use the newest installed Xcode — pinned versions on GitHub images
          # often lack their matching iOS simulator runtime.
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then
            sudo xcode-select -s "$NEWEST/Contents/Developer"
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Pick available iPhone simulator
        run: |
          DEVICE_NAME=$(xcrun simctl list devices available | sed -nE 's/^ +(iPhone [^(]+) \(.*/\1/p' | head -1 | sed 's/ *$//')
          if [ -z "$DEVICE_NAME" ]; then
            echo "No available iPhone simulator found:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator: $DEVICE_NAME"
          echo "SIM_DEVICE=$DEVICE_NAME" >> "$GITHUB_ENV"

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -scheme BrainApp -project BrainApp.xcodeproj

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme BrainApp \
            -project BrainApp.xcodeproj \
            -destination "platform=iOS Simulator,name=$SIM_DEVICE" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | tail -100

      - name: Show compiler errors
        if: failure()
        run: |
          grep -E "error: " build.log | sort -u | head -80 || true

      - name: Run BrainApp Tests
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme BrainApp \
            -project BrainApp.xcodeproj \
            -destination "platform=iOS Simulator,name=$SIM_DEVICE" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:BrainAppTests \
            2>&1 | tee test.log | tail -100

      - name: Show test failures
        if: failure()
        run: |
          grep -E "error: |failed" test.log | sort -u | head -80 || true
