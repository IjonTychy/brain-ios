name: TestFlight

# Archives, signs and uploads the app to TestFlight from a GitHub-hosted macOS
# runner: no Mac and no Xcode Cloud needed. Manual trigger only. Requires the
# repository secrets listed in docs/TESTFLIGHT-CI.md. Never uploads the IPA as
# an artifact (artifacts of a public repository are public).

on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    name: Archive & upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 90
    env:
      BRAIN_BUNDLE_ID_BASE: ${{ secrets.BRAIN_BUNDLE_ID_BASE }}
      BRAIN_TEAM_ID: ${{ secrets.BRAIN_TEAM_ID }}
      BRAIN_GOOGLE_CLIENT_ID: ${{ secrets.BRAIN_GOOGLE_CLIENT_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
      MATCH_PAT: ${{ secrets.MATCH_PAT }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL || 'https://github.com/IjonTychy/brain-ios-certificates.git' }}
      BUILD_NUMBER_OFFSET: ${{ vars.BUILD_NUMBER_OFFSET || '1000' }}
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets
        run: |
          MISSING=0
          for NAME in BRAIN_BUNDLE_ID_BASE BRAIN_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_API_KEY_P8 MATCH_PAT MATCH_PASSWORD; do
            if [ -z "${!NAME}" ]; then
              echo "Secret $NAME fehlt (Settings -> Secrets and variables -> Actions)."
              MISSING=1
            fi
          done
          [ "$MISSING" = "0" ]

      - name: Select Xcode
        run: |
          # Use the newest installed Xcode (same as ios-build.yml).
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then
            sudo xcode-select -s "$NEWEST/Contents/Developer"
          fi
          xcodebuild -version

      - name: Write Config/Local.xcconfig from secrets
        run: |
          {
            echo "// Generated by the TestFlight workflow from repository secrets."
            echo "BRAIN_BUNDLE_ID_BASE = ${BRAIN_BUNDLE_ID_BASE}"
            echo "BRAIN_TEAM_ID = ${BRAIN_TEAM_ID}"
            if [ -n "${BRAIN_GOOGLE_CLIENT_ID}" ]; then
              echo "BRAIN_GOOGLE_CLIENT_ID = ${BRAIN_GOOGLE_CLIENT_ID}"
            fi
          } > Config/Local.xcconfig

      - name: Compute build number
        run: |
          # CFBundleVersion must exceed every TestFlight build of this version;
          # BUILD_NUMBER_OFFSET (repository variable) lifts it above older uploads.
          echo "BUILD_NUMBER=$((BUILD_NUMBER_OFFSET + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -scheme BrainApp -project BrainApp.xcodeproj

      - name: Archive, sign and upload
        run: |
          export MATCH_GIT_BASIC_AUTHORIZATION=$(printf '%s' "IjonTychy:${MATCH_PAT}" | base64)
          echo "Build number: ${BUILD_NUMBER}"
          fastlane ios testflight

      - name: Show build errors
        if: failure()
        run: |
          shopt -s nullglob
          for LOG in "$HOME"/Library/Logs/gym/*.log; do
            echo "== $LOG"
            grep -E "error: " "$LOG" | sort -u | head -60 || true
          done
